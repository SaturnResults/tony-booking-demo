<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book Physiotherapy | Tony Kosoko Physiotherapy</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="style.css">
</head>
<body class="booking-page">

<header class="site-head">
  <div class="wrap">
    <a class="brand" href="index.html">Tony Kosoko <span>Physiotherapy</span></a>
    <a class="head-link" href="index.html">Back to services</a>
  </div>
</header>

<main class="wrap">

  <div class="steps">
    <span class="step">1. Choose your service</span>
    <span class="dot"></span>
    <b class="step is-on">2. Pick a time</b>
    <span class="dot"></span>
    <span class="step">3. Confirmed</span>
  </div>

  <section class="booking-head">
    <h1>Book physiotherapy</h1>
    <p class="lead">Select a service, then a date and time. You will get an instant confirmation by email.</p>
  </section>

  <div class="booking">
    <iframe src="https://api.leadconnectorhq.com/booking/lead-mate-c4q6njrjvz9/bp/ZsilMTXBaeIs8YnSlWjc?heightMode=fixed&showHeader=true" allow="payment" scrolling="no" id="ZsilMTXBaeIs8YnSlWjc_1788259026417"></iframe>
  </div>

</main>

<footer class="site-foot">
  <div class="wrap">Demo booking flow. Tony Kosoko Physiotherapy, West London.</div>
</footer>

<script src="https://link.msgsndr.com/js/form_embed.js" type="text/javascript"></script>
<script>
/* form_embed.js parks the iframe off screen (left:-9999px, visibility:hidden)
   and only reveals it when the widget posts an "iframeLoaded" message. That
   message is slow: measured live on a phone viewport, the card sat empty for
   about 23 seconds before the calendar appeared. So reveal it ourselves if
   the helper has not got there first. Same workaround as the one on the live
   site's booking page. */
(function () {
  var frame = document.querySelector('.booking iframe');
  if (!frame) return;

  function reveal() {
    var cs = window.getComputedStyle(frame);
    if (cs.visibility === 'hidden' || cs.opacity === '0' || frame.style.left === '-9999px') {
      /* set properties one by one, never cssText, so any height form_embed.js
         has already applied survives */
      frame.style.opacity = '1';
      frame.style.visibility = 'visible';
      frame.style.pointerEvents = 'auto';
      frame.style.position = 'relative';
      frame.style.left = '0';
      frame.style.display = 'block';
    }
  }

  frame.addEventListener('load', function () {
    setTimeout(reveal, 2500);
    setTimeout(reveal, 6000);
  });
})();
</script>
</body>
</html>
